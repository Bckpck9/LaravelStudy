services:

  laravel:
    image: php:8.4-fpm
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel
    volumes:
      - ..:/var/www/html
    networks:
      - app-network
    
  nginx:
    image: nginx:alpine
    container_name: my-nginx_1
    ports:
      - "8080:80"
    volumes:
      - ..:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: my-redis_2
    networks:
      - app-network

  postgres:
    image: postgres:16
    container_name: my-postgres_3
    ports:
      - "5426:5432"
    networks:
      - app-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: myapp

networks:
  app-network:

volumes:
  postgres-data: 